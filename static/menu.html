<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Menu — RestroFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0f; --surface:#14141e; --surface2:#1c1c28; --border:#26263a;
    --accent:#ff6b35; --green:#06d6a0; --text:#f0f0f5; --muted:#8888a0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; padding-bottom:120px; }

  /* HEADER */
  .header { background:var(--surface); border-bottom:1px solid var(--border);
    padding:16px 20px; position:sticky; top:0; z-index:100; }
  .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .restro-name { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:var(--accent); }
  .table-info { font-size:13px; color:var(--muted); }
  .cart-btn { background:linear-gradient(135deg,var(--accent),#ff8c5a); border:none; border-radius:12px;
    padding:10px 18px; color:white; font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif;
    display:flex; align-items:center; gap:6px; }
  .cart-count { background:white; color:var(--accent); border-radius:20px; padding:1px 7px; font-size:12px; font-weight:700; }

  /* SEARCH */
  .search-wrap { position:relative; }
  .search-inp { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:12px;
    padding:10px 16px 10px 40px; color:var(--text); font-size:14px; font-family:'DM Sans',sans-serif;
    outline:none; }
  .search-inp:focus { border-color:var(--accent); }
  .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:16px; }

  /* CATEGORIES */
  .cats { display:flex; gap:8px; overflow-x:auto; padding:14px 20px; scrollbar-width:none; border-bottom:1px solid var(--border); }
  .cats::-webkit-scrollbar { display:none; }
  .cat-btn { background:var(--surface2); border:1px solid var(--border); border-radius:20px;
    padding:7px 16px; font-size:13px; color:var(--muted); cursor:pointer; white-space:nowrap; transition:all 0.2s; font-family:'DM Sans',sans-serif; }
  .cat-btn.active { background:rgba(255,107,53,0.15); border-color:var(--accent); color:var(--accent); }

  /* MENU ITEMS */
  .menu-content { padding:16px 20px; }
  .cat-section { margin-bottom:24px; }
  .cat-title { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; margin-bottom:14px;
    padding-bottom:8px; border-bottom:1px solid var(--border); }

  .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .item-card { background:var(--surface); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; transition:border-color 0.2s; }
  .item-card:hover { border-color:rgba(255,107,53,0.3); }
  .item-card.unavailable { opacity:0.5; }

  .item-img { width:100%; height:100px; object-fit:cover; background:var(--surface2); }
  .item-img-placeholder { width:100%; height:80px; background:var(--surface2);
    display:flex; align-items:center; justify-content:center; font-size:32px; }

  .item-body { padding:10px; }
  .item-top { display:flex; align-items:flex-start; justify-content:space-between; gap:4px; margin-bottom:4px; }
  .item-name { font-size:13px; font-weight:600; line-height:1.3; }
  .veg-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:3px; }
  .veg-dot.veg { background:var(--green); }
  .veg-dot.nonveg { background:var(--accent); }
  .item-desc { font-size:11px; color:var(--muted); margin-bottom:8px; line-height:1.4; }
  .item-footer { display:flex; align-items:center; justify-content:space-between; }
  .item-price { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; color:var(--accent); }
  .bestseller { font-size:10px; background:rgba(255,209,102,0.15); color:#ffd166; border:1px solid rgba(255,209,102,0.3);
    border-radius:20px; padding:2px 8px; }

  /* ADD BUTTON */
  .add-btn { background:var(--surface2); border:1px solid var(--border); border-radius:20px;
    padding:5px 14px; font-size:13px; color:var(--text); cursor:pointer; font-family:'DM Sans',sans-serif;
    transition:all 0.2s; white-space:nowrap; }
  .add-btn:hover { border-color:var(--accent); color:var(--accent); }
  .qty-ctrl { display:flex; align-items:center; gap:6px; }
  .qty-btn { width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--surface2);
    color:var(--text); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .qty-btn:hover { border-color:var(--accent); color:var(--accent); }
  .qty-num { font-weight:700; font-size:14px; min-width:20px; text-align:center; }

  /* CART DRAWER */
  .cart-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; display:none; }
  .cart-overlay.open { display:block; }
  .cart-drawer { position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-radius:20px 20px 0 0; border-top:1px solid var(--border); z-index:201;
    transform:translateY(100%); transition:transform 0.3s ease; max-height:80vh; overflow-y:auto; }
  .cart-drawer.open { transform:translateY(0); }
  .cart-hdr { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--surface); }
  .cart-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; }
  .cart-x { background:var(--surface2); border:1px solid var(--border); border-radius:8px; width:30px; height:30px;
    cursor:pointer; color:var(--muted); font-size:18px; display:flex; align-items:center; justify-content:center; }
  .cart-items { padding:16px 20px; }
  .cart-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
  .cart-item:last-child { border-bottom:none; }
  .ci-name { font-size:14px; font-weight:500; }
  .ci-price { font-size:13px; color:var(--muted); }
  .ci-right { display:flex; align-items:center; gap:10px; }
  .ci-total { font-size:14px; font-weight:600; color:var(--accent); min-width:50px; text-align:right; }
  .cart-footer { padding:16px 20px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface); }
  .cart-total-row { display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
  .cart-total-row.grand { font-family:'Syne',sans-serif; font-size:17px; font-weight:700; }
  .place-btn { width:100%; background:linear-gradient(135deg,var(--accent),#ff8c5a); border:none; border-radius:14px;
    padding:14px; color:white; font-size:15px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; margin-top:14px; }
  .place-btn:disabled { opacity:0.5; cursor:not-allowed; }

  /* BOTTOM BAR */
  .bottom-bar { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
    padding:14px 20px; display:flex; gap:10px; }
  .bb-btn { flex:1; padding:12px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; border:1px solid; }
  .bb-cart { background:linear-gradient(135deg,var(--accent),#ff8c5a); color:white; border:none; }
  .bb-cart:disabled { opacity:0.4; cursor:not-allowed; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-icon { font-size:48px; margin-bottom:12px; }

  /* CUSTOMIZE SHEET (variants + modifiers) */
  .cz-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; display:none; }
  .cz-overlay.open { display:block; }
  .cz-sheet { position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-radius:20px 20px 0 0; border-top:1px solid var(--border); z-index:301;
    transform:translateY(100%); transition:transform 0.3s ease; max-height:85vh;
    overflow-y:auto; padding-bottom:120px; }
  .cz-sheet.open { transform:translateY(0); }
  .cz-hdr { padding:16px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:flex-start; justify-content:space-between; position:sticky;
    top:0; background:var(--surface); z-index:2; }
  .cz-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; }
  .cz-sub { font-size:12px; color:var(--muted); margin-top:3px; }
  .cz-x { background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    width:30px; height:30px; cursor:pointer; color:var(--muted); font-size:18px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cz-body { padding:14px 20px; }
  .cz-group { margin-bottom:18px; }
  .cz-group-name { font-size:13px; font-weight:700; margin-bottom:4px; display:flex;
    align-items:center; justify-content:space-between; }
  .cz-rule { font-size:11px; color:var(--muted); margin-bottom:10px; }
  .cz-req { color:#ff6b6b; font-size:11px; font-weight:600; }
  .cz-opt-row { display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; margin-bottom:6px; cursor:pointer; transition:border-color 0.15s; }
  .cz-opt-row.selected { border-color:var(--accent); background:rgba(255,107,53,0.1); }
  .cz-opt-row.disabled { opacity:0.4; cursor:not-allowed; }
  .cz-opt-name { font-size:14px; }
  .cz-opt-price { font-size:13px; color:var(--accent); font-weight:600; }
  .cz-foot { position:fixed; bottom:0; left:0; right:0; padding:14px 20px;
    background:var(--surface); border-top:1px solid var(--border); z-index:302;
    display:none; flex-direction:column; gap:8px; }
  .cz-foot.open { display:flex; }
  .cz-total-row { display:flex; align-items:center; justify-content:space-between;
    font-size:14px; }
  .cz-total-amt { font-family:'Syne',sans-serif; font-size:18px; font-weight:700;
    color:var(--accent); }
  .cz-add-btn { background:linear-gradient(135deg,var(--accent),#ff8c5a); border:none;
    border-radius:12px; padding:13px; color:white; font-size:15px; font-weight:700;
    cursor:pointer; font-family:'DM Sans',sans-serif; }
  .cz-add-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:var(--surface);
    border:1px solid var(--border); border-radius:12px; padding:10px 20px; font-size:14px; z-index:9999;
    display:none; gap:8px; align-items:center; white-space:nowrap; box-shadow:0 8px 32px rgba(0,0,0,0.4); }
  .toast.show { display:flex; }

  .loading { text-align:center; padding:60px 20px; color:var(--muted); }
  .spin { width:32px; height:32px; border:2px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* SESSION ENDED */
  #session-ended { display:none; min-height:100vh; align-items:center; justify-content:center; flex-direction:column; padding:40px; text-align:center; }
  #session-ended.show { display:flex; }
</style>
</head>
<body>

<!-- SESSION ENDED -->
<div id="session-ended">
  <div style="font-size:64px;margin-bottom:16px">⏰</div>
  <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:8px">Session Ended</div>
  <div style="color:var(--muted);font-size:14px">Your table session has ended. Please scan the QR code again to start a new session.</div>
</div>

<!-- MAIN APP -->
<div id="main-app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="restro-name" id="restro-name">__RESTRO_NAME__</div>
        <div class="table-info" id="table-info"></div>
      </div>
      <button class="cart-btn" onclick="openCart()">
        🛒 Cart <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-inp" id="search-inp" placeholder="Search menu..." oninput="filterMenu()">
    </div>
  </div>

  <!-- CATEGORIES -->
  <div class="cats" id="cats-bar"></div>

  <!-- MENU -->
  <div class="menu-content" id="menu-content">
    <div class="loading"><div class="spin"></div>Loading menu...</div>
  </div>
</div>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>

<!-- CUSTOMIZE SHEET (variants + modifiers) -->
<div class="cz-overlay" id="cz-overlay" onclick="closeCustomize()"></div>
<div class="cz-sheet" id="cz-sheet">
  <div class="cz-hdr">
    <div>
      <div class="cz-title" id="cz-title">Customize</div>
      <div class="cz-sub" id="cz-sub"></div>
    </div>
    <div class="cz-x" onclick="closeCustomize()">×</div>
  </div>
  <div class="cz-body" id="cz-body"></div>
  <div class="cz-foot open" id="cz-foot">
    <div class="cz-total-row"><span>Total</span><span class="cz-total-amt" id="cz-total">₹0</span></div>
    <button class="cz-add-btn" id="cz-add-btn" onclick="confirmCustomize()">Add to Cart</button>
  </div>
</div>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-hdr">
    <div class="cart-title">🛒 Your Cart</div>
    <div class="cart-x" onclick="closeCart()">×</div>
  </div>
  <div class="cart-items" id="cart-items-list"></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Subtotal</span><span id="ct-sub">₹0</span></div>
    <div class="cart-total-row"><span id="ct-gst-label">GST (5%)</span><span id="ct-gst">₹0</span></div>
    <div class="cart-total-row grand"><span>Total</span><span id="ct-total">₹0</span></div>
    <button class="place-btn" id="place-btn" onclick="placeOrder()">📤 Send to Kitchen</button>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="bb-btn bb-cart" id="bottom-cart-btn" onclick="openCart()" disabled>
    🛒 View Cart (<span id="bb-count">0</span> items)
  </button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><span id="t-icon"></span><span id="t-msg"></span></div>

<script>
const BASE    = window.location.origin;
const params  = new URLSearchParams(window.location.search);
const SLUG    = window.location.pathname.split('/')[2] || '';
const TABLE   = params.get('t') || '';
const PHONE   = params.get('p') || '';
const CNAME   = params.get('n') || 'Guest';
const TOKEN   = params.get('k') || '';
const GST_RATE = 0.05; // will be overridden from config

let allMenu = [];
let cart    = {}; // cart_key → {item, qty, variant_id, modifier_ids, unit_price, display_name, base_name, category}
let categories = [];
let _czState = null;  // current customize-sheet state

// ── INIT ──────────────────────────────────────────────────────────────────
async function init() {
  if (!SLUG || !TABLE || !PHONE) {
    showSessionEnded(); return;
  }

  document.getElementById('table-info').textContent = `🪑 Table ${TABLE} | 👤 ${CNAME}`;

  // Load menu
  try {
    const r = await fetch(`${BASE}/webhook/${SLUG}/menu?view=1&table=${TABLE}`);
    const data = await r.json();

    if (data.sessionEnded) { showSessionEnded(); return; }

    allMenu = Array.isArray(data) ? data : [];
    buildCategories();
    renderMenu(allMenu);
  } catch(e) {
    document.getElementById('menu-content').innerHTML =
      '<div class="empty-state"><div class="empty-icon">❌</div><p>Failed to load menu. Please try again.</p></div>';
  }

  // Sync cart from server
  try {
    const r = await fetch(`${BASE}/webhook/${SLUG}/get-cart`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({phone:PHONE, token:TOKEN})
    });
    const d = await r.json();
    if (d.valid && d.orders) {
      d.orders.forEach(o => {
        // Server returns cart_key as `o.id` (e.g. "5||" or "5|2|7,12") for
        // customised items. Falls back to legacy plain id for non-customised.
        const key = o.id;
        cart[key] = {
          item: { id: o.menu_id || o.id, name: o.name, price: o.price, category: o.category },
          qty: o.quantity,
          variant_id: o.variant_id || null,
          modifier_ids: o.modifier_ids || [],
          unit_price: o.price,
          display_name: o.name,
          base_name: o.menu_name || o.name,
          category: o.category || 'Other',
        };
      });
      updateCartUI();
    }
  } catch(e) {}
}

function showSessionEnded() {
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('bottom-bar')?.remove();
  document.getElementById('session-ended').classList.add('show');
}

// ── CATEGORIES ────────────────────────────────────────────────────────────
function buildCategories() {
  const cats = ['All', ...new Set(allMenu.map(i => i.category))];
  categories = cats;
  const bar = document.getElementById('cats-bar');
  bar.innerHTML = cats.map((c,i) =>
    `<button class="cat-btn ${i===0?'active':''}" onclick="filterCat('${c}',this)">${c}</button>`
  ).join('');
}

function filterCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = cat === 'All' ? allMenu : allMenu.filter(i => i.category === cat);
  renderMenu(filtered);
}

function filterMenu() {
  const q = document.getElementById('search-inp').value.toLowerCase();
  const filtered = allMenu.filter(i =>
    i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q) || (i.description||'').toLowerCase().includes(q)
  );
  renderMenu(filtered);
}

// ── RENDER MENU ───────────────────────────────────────────────────────────
function renderMenu(items) {
  const container = document.getElementById('menu-content');
  if (!items.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>No items found</p></div>';
    return;
  }

  // Group by category
  const grouped = {};
  items.forEach(item => {
    if (!grouped[item.category]) grouped[item.category] = [];
    grouped[item.category].push(item);
  });

  let html = '';
  Object.entries(grouped).forEach(([cat, catItems]) => {
    html += `<div class="cat-section"><div class="cat-title">${cat}</div><div class="menu-grid">`;
    catItems.forEach(item => {
      // Total qty in cart for this base menu item, summed across customisations
      const inCartQty = Object.values(cart).reduce((sum, c) =>
        String(c.item.id) === String(item.id) ? sum + c.qty : sum, 0);

      const hasOpts = !!item.has_options;

      let actionHtml;
      if (hasOpts) {
        // Always go through the customize sheet so variant/modifier are picked
        // each time. Show qty count next to button if anything is already in cart.
        actionHtml = `<button class="add-btn" onclick="openCustomize('${item.id}')">
          ${inCartQty > 0 ? '+ Add ('+inCartQty+')' : '+ Customize'}
        </button>`;
      } else if (inCartQty > 0) {
        // Plain item with quantity → show − / qty / + control. We can safely use
        // the simple cart_key for plain items (no variant, no mods).
        const plainKey = `${item.id}||`;
        actionHtml = `<div class="qty-ctrl">
            <button class="qty-btn" onclick="updateQty('${plainKey}',-1)">−</button>
            <span class="qty-num">${inCartQty}</span>
            <button class="qty-btn" onclick="updateQty('${plainKey}',1)">+</button>
          </div>`;
      } else {
        actionHtml = `<button class="add-btn" onclick="addPlainToCart('${item.id}')">+ Add</button>`;
      }

      const unavailClass = item.available === false ? 'unavailable' : '';
      const imgHtml = item.image
        ? `<img class="item-img" src="${item.image}" alt="${item.name}" onerror="this.style.display='none'">`
        : `<div class="item-img-placeholder">${item.type==='nonveg'?'🍗':'🥗'}</div>`;

      const priceLabel = hasOpts && item.variants && item.variants.length
        ? `from ₹${Math.min(...item.variants.map(v=>v.price))}`
        : `₹${item.price}`;

      html += `<div class="item-card ${unavailClass}">
        ${imgHtml}
        <div class="item-body">
          <div class="item-top">
            <div class="item-name">${item.name} ${item.bestseller?'<span class="bestseller">⭐ Best</span>':''}</div>
            <div class="veg-dot ${item.type}"></div>
          </div>
          ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
          <div class="item-footer">
            <div class="item-price">${priceLabel}</div>
            ${item.available !== false ? actionHtml : '<span style="font-size:11px;color:var(--muted)">Unavailable</span>'}
          </div>
        </div>
      </div>`;
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

// ── CART ──────────────────────────────────────────────────────────────────
function addPlainToCart(id) {
  const item = allMenu.find(i => String(i.id) === String(id));
  if (!item) return;
  const key = `${item.id}||`;
  if (cart[key]) cart[key].qty++;
  else cart[key] = {
    item: {id:item.id, name:item.name, price:item.price, category:item.category},
    qty: 1, variant_id: null, modifier_ids: [],
    unit_price: item.price, display_name: item.name,
    base_name: item.name, category: item.category || 'Other',
  };
  updateCartUI();
  renderMenu(allMenu.filter(i => {
    const search = document.getElementById('search-inp').value.toLowerCase();
    return !search || i.name.toLowerCase().includes(search);
  }));
  showToast(`${item.name} added!`, 'success');
}

// Backward-compat shim: if anything still calls `addToCart(id)` it now opens
// the customize sheet for items with options (or adds plain otherwise).
function addToCart(id) {
  const item = allMenu.find(i => String(i.id) === String(id));
  if (!item) return;
  if (item.has_options) openCustomize(id);
  else addPlainToCart(id);
}

// ── CUSTOMIZE SHEET ───────────────────────────────────────────────────────
function openCustomize(id) {
  const item = allMenu.find(i => String(i.id) === String(id));
  if (!item) return;
  // Pre-select default variant + default modifiers
  const variants = item.variants || [];
  const groups   = item.modifier_groups || [];
  const defVar   = variants.find(v => v.is_default && v.available !== false)
                || variants.find(v => v.available !== false)
                || null;

  const selectedMods = {}; // group_id → Set<modifier_id>
  groups.forEach(g => {
    const sel = new Set();
    g.modifiers.forEach(m => {
      if (m.is_default && m.available !== false && sel.size < (g.max_select || 1)) sel.add(m.id);
    });
    selectedMods[g.id] = sel;
  });

  _czState = {
    item, variants, groups,
    variant_id: defVar ? defVar.id : null,
    selectedMods,
  };

  document.getElementById('cz-title').textContent = item.name;
  document.getElementById('cz-sub').textContent =
    (variants.length ? variants.length + ' size' + (variants.length>1?'s':'') : '')
    + (variants.length && groups.length ? ' · ' : '')
    + (groups.length ? groups.length + ' add-on group' + (groups.length>1?'s':'') : '');

  renderCustomize();
  document.getElementById('cz-overlay').classList.add('open');
  document.getElementById('cz-sheet').classList.add('open');
}

function closeCustomize() {
  document.getElementById('cz-overlay').classList.remove('open');
  document.getElementById('cz-sheet').classList.remove('open');
  _czState = null;
}

function renderCustomize() {
  if (!_czState) return;
  const { variants, groups, variant_id, selectedMods } = _czState;
  let html = '';
  if (variants.length) {
    html += `<div class="cz-group">
      <div class="cz-group-name">Choose size <span class="cz-req">Required</span></div>
      <div class="cz-rule">Pick one</div>`;
    variants.forEach(v => {
      const dis = v.available === false ? 'disabled' : '';
      const sel = v.id === variant_id ? 'selected' : '';
      html += `<div class="cz-opt-row ${sel} ${dis}" onclick="${dis ? '' : `selectVariant(${v.id})`}">
        <div class="cz-opt-name">${v.name}</div>
        <div class="cz-opt-price">₹${v.price}</div>
      </div>`;
    });
    html += `</div>`;
  }
  groups.forEach(g => {
    const sel = selectedMods[g.id];
    const reqHtml = g.required ? '<span class="cz-req">Required</span>' : '';
    const ruleTxt = g.max_select === 1
      ? 'Pick one' + (g.required ? '' : ' (optional)')
      : `Pick up to ${g.max_select}` + (g.min_select > 0 ? ` · min ${g.min_select}` : '');
    html += `<div class="cz-group">
      <div class="cz-group-name">${g.name} ${reqHtml}</div>
      <div class="cz-rule">${ruleTxt}</div>`;
    g.modifiers.forEach(m => {
      const dis = m.available === false ? 'disabled' : '';
      const isSel = sel.has(m.id) ? 'selected' : '';
      const onclick = dis ? '' : `toggleModifier(${g.id},${m.id})`;
      const priceTxt = m.price > 0 ? `+₹${m.price}` : (m.price < 0 ? `-₹${-m.price}` : 'Free');
      html += `<div class="cz-opt-row ${isSel} ${dis}" onclick="${onclick}">
        <div class="cz-opt-name">${m.name}</div>
        <div class="cz-opt-price">${priceTxt}</div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('cz-body').innerHTML = html;
  updateCustomizeTotal();
}

function selectVariant(vid) {
  if (!_czState) return;
  _czState.variant_id = vid;
  renderCustomize();
}

function toggleModifier(gid, mid) {
  if (!_czState) return;
  const group = _czState.groups.find(g => g.id === gid);
  if (!group) return;
  const sel = _czState.selectedMods[gid];
  if (sel.has(mid)) {
    sel.delete(mid);
  } else {
    if (group.max_select === 1) {
      // single-choice → replace
      sel.clear();
      sel.add(mid);
    } else if (sel.size < (group.max_select || 1)) {
      sel.add(mid);
    } else {
      showToast(`Max ${group.max_select} selections in ${group.name}`, 'error');
      return;
    }
  }
  renderCustomize();
}

function _customizeUnitPrice() {
  if (!_czState) return 0;
  const { item, variants, variant_id, groups, selectedMods } = _czState;
  let p = item.price || 0;
  if (variant_id) {
    const v = variants.find(x => x.id === variant_id);
    if (v) p = v.price;
  }
  groups.forEach(g => {
    selectedMods[g.id].forEach(mid => {
      const m = g.modifiers.find(x => x.id === mid);
      if (m) p += m.price || 0;
    });
  });
  return p;
}

function updateCustomizeTotal() {
  if (!_czState) return;
  document.getElementById('cz-total').textContent = '₹' + _customizeUnitPrice().toFixed(0);
  // Validate min_select
  const valid = _czState.groups.every(g => _czState.selectedMods[g.id].size >= (g.min_select || 0))
    && (!_czState.variants.length || _czState.variant_id != null);
  document.getElementById('cz-add-btn').disabled = !valid;
}

function confirmCustomize() {
  if (!_czState) return;
  const { item, variant_id, groups, selectedMods } = _czState;
  const modIds = [];
  groups.forEach(g => selectedMods[g.id].forEach(mid => modIds.push(mid)));
  modIds.sort((a,b) => a - b);

  const cartKey = `${item.id}|${variant_id || ''}|${modIds.join(',')}`;
  const unitPrice = _customizeUnitPrice();

  // Build display name to mirror what the server will produce
  const parts = [item.name];
  if (variant_id) {
    const v = (item.variants || []).find(x => x.id === variant_id);
    if (v) parts.push(`(${v.name})`);
  }
  const modNames = [];
  groups.forEach(g => selectedMods[g.id].forEach(mid => {
    const m = g.modifiers.find(x => x.id === mid);
    if (m) modNames.push(m.name);
  }));
  if (modNames.length) parts.push('+ ' + modNames.join(', '));
  const displayName = parts.join(' ');

  if (cart[cartKey]) {
    cart[cartKey].qty++;
  } else {
    cart[cartKey] = {
      item: {id: item.id, name: item.name, price: unitPrice, category: item.category},
      qty: 1,
      variant_id: variant_id,
      modifier_ids: modIds,
      unit_price: unitPrice,
      display_name: displayName,
      base_name: item.name,
      category: item.category || 'Other',
    };
  }
  updateCartUI();
  closeCustomize();
  showToast(`${displayName} added!`, 'success');
  renderMenu(allMenu);
}

function updateQty(key, delta) {
  if (!cart[key]) return;
  cart[key].qty += delta;
  if (cart[key].qty <= 0) delete cart[key];
  updateCartUI();
  renderMenu(allMenu);
}

function updateCartUI() {
  const totalItems = Object.values(cart).reduce((s,c) => s + c.qty, 0);
  document.getElementById('cart-count').textContent = totalItems;
  document.getElementById('bb-count').textContent = totalItems;
  document.getElementById('bottom-cart-btn').disabled = totalItems === 0;

  // Cart drawer items
  const listEl = document.getElementById('cart-items-list');
  if (!totalItems) {
    listEl.innerHTML = '<div class="empty-state" style="padding:30px"><div class="empty-icon">🛒</div><p>Cart is empty</p></div>';
  } else {
    listEl.innerHTML = Object.entries(cart).map(([key, c]) =>
      `<div class="cart-item">
        <div><div class="ci-name">${c.display_name || c.item.name}</div><div class="ci-price">₹${c.unit_price || c.item.price} each</div></div>
        <div class="ci-right">
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="updateQty('${key}',-1)">−</button>
            <span class="qty-num">${c.qty}</span>
            <button class="qty-btn" onclick="updateQty('${key}',1)">+</button>
          </div>
          <div class="ci-total">₹${((c.unit_price || c.item.price) * c.qty).toFixed(0)}</div>
        </div>
      </div>`
    ).join('');
  }

  // Totals
  const sub  = Object.values(cart).reduce((s,c) => s + (c.unit_price || c.item.price) * c.qty, 0);
  const gst  = Math.round(sub * GST_RATE);
  const total = sub + gst;
  document.getElementById('ct-sub').textContent   = '₹' + sub.toFixed(0);
  document.getElementById('ct-gst').textContent   = '₹' + gst.toFixed(0);
  document.getElementById('ct-total').textContent = '₹' + total.toFixed(0);
  document.getElementById('place-btn').disabled = totalItems === 0;
}

function openCart()  {
  document.getElementById('cart-overlay').classList.add('open');
  document.getElementById('cart-drawer').classList.add('open');
}
function closeCart() {
  document.getElementById('cart-overlay').classList.remove('open');
  document.getElementById('cart-drawer').classList.remove('open');
}

// ── PLACE ORDER ───────────────────────────────────────────────────────────
async function placeOrder() {
  const btn = document.getElementById('place-btn');
  btn.disabled = true; btn.textContent = 'Sending...';

  const items = Object.values(cart).map(c => ({
    id: String(c.item.id),
    name: c.base_name || c.item.name,
    price: c.unit_price || c.item.price,
    qty: c.qty,
    category: c.category || c.item.category || 'Other',
    variant_id: c.variant_id || null,
    modifier_ids: c.modifier_ids || [],
    display_name: c.display_name || c.item.name,
  }));

  try {
    const r = await fetch(`${BASE}/webhook/${SLUG}/receive-order`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({phone:PHONE, table:TABLE, name:CNAME, token:TOKEN, items, fullCart:true})
    });
    const d = await r.json();
    if (d.success) {
      cart = {};
      updateCartUI();
      closeCart();
      showToast('🍳 Order sent to kitchen!', 'success');
    } else {
      showToast(d.error || 'Failed to place order', 'error');
      btn.disabled = false; btn.textContent = '📤 Send to Kitchen';
    }
  } catch(e) {
    showToast('Network error', 'error');
    btn.disabled = false; btn.textContent = '📤 Send to Kitchen';
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  document.getElementById('t-icon').textContent = type==='success' ? '✅' : '❌';
  document.getElementById('t-msg').textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.className='toast', 2500);
}
